<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#02050d">
  <title>零一秒 · 23岁生日快乐</title>
  <style>
    :root { --ivory:#f7f0e2; --gold:#eac56f; --muted:#b8b8c7; }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:#02050d; }
    body { color:var(--ivory); font-synthesis:none; -webkit-font-smoothing:antialiased; }
    .art,.veil { position:fixed; inset:0; width:100%; height:100%; }
    .art { z-index:0; }
    .art img { width:100%; height:100%; object-fit:cover; object-position:center; display:block; filter:saturate(.95) contrast(1.03); transition:filter .8s ease; }
    .veil {
      z-index:1; pointer-events:none;
      background:
        linear-gradient(90deg,rgba(1,4,11,.68) 0%,rgba(1,4,11,.20) 36%,transparent 63%),
        radial-gradient(circle at 11% 50%,rgba(13,23,55,.32),transparent 34%),
        linear-gradient(180deg,rgba(0,0,0,.16),transparent 18%,transparent 80%,rgba(0,0,0,.34));
    }
    main {
      position:relative; z-index:3; height:100%; width:min(44vw,690px);
      display:flex; align-items:center; padding-left:clamp(38px,7.5vw,145px);
    }
    .copy { width:min(540px,36vw); transform:translateY(8px); }
    .eyebrow {
      margin:0 0 26px; font:500 clamp(9px,.68vw,12px)/1.4 "Avenir Next","Helvetica Neue",sans-serif;
      letter-spacing:.48em; color:#d5bc7d; text-transform:uppercase; opacity:0;
      transform:translateY(10px); animation:rise .9s .2s ease forwards;
    }
    .age-line { display:flex; align-items:flex-end; gap:20px; margin-bottom:24px; }
    .age {
      font:italic 400 clamp(92px,9.2vw,174px)/.72 Didot,"Bodoni 72","Times New Roman",serif;
      letter-spacing:-.065em; color:transparent;
      background:linear-gradient(145deg,#fff9d8 4%,#e8c369 38%,#ad7333 70%,#f9e7a7 96%);
      -webkit-background-clip:text; background-clip:text;
      filter:drop-shadow(0 4px 22px rgba(219,164,55,.18));
      opacity:0; transform:translateY(20px); animation:rise 1.1s .42s cubic-bezier(.2,.8,.2,1) forwards;
    }
    .age-note {
      padding-bottom:5px; font:400 clamp(9px,.72vw,12px)/1.8 "Avenir Next","Helvetica Neue",sans-serif;
      letter-spacing:.3em; color:#aaaabb; white-space:nowrap; opacity:0;
      animation:fade 1s .9s ease forwards;
    }
    .rule { width:52px; height:1px; margin:0 0 24px; background:linear-gradient(90deg,var(--gold),transparent); }
    h1 {
      margin:0; font:300 clamp(40px,4.2vw,74px)/1.14 "Songti SC","STSong","Noto Serif CJK SC",serif;
      letter-spacing:.22em; white-space:nowrap; text-shadow:0 2px 24px rgba(0,0,0,.7);
      opacity:0; transform:translateY(16px); animation:rise 1s .65s ease forwards;
    }
    .birthday {
      margin:13px 0 0 2px; font:300 clamp(13px,1.05vw,18px)/1.5 "Songti SC","STSong",serif;
      letter-spacing:.72em; color:#ddd6cb; opacity:0; animation:fade 1.2s 1s ease forwards;
    }
    .wish {
      max-width:430px; margin:32px 0 0; padding-left:18px; border-left:1px solid rgba(234,197,111,.5);
      font:300 clamp(12px,.9vw,15px)/2.05 "Songti SC","STSong",serif;
      letter-spacing:.15em; color:#c3c1c7; opacity:0; transform:translateY(10px);
      animation:rise 1s 1.15s ease forwards;
    }
    .wish span { color:#f0e3c6; }
    .signature {
      margin-top:21px; font:italic 400 clamp(12px,.9vw,16px)/1 Didot,"Bodoni 72",serif;
      letter-spacing:.16em; color:#ba9d64; opacity:0; animation:fade 1s 1.5s ease forwards;
    }
    .actions {
      position:fixed; z-index:4; left:clamp(38px,7.5vw,145px); bottom:clamp(28px,5vh,60px);
      display:flex; align-items:center; gap:32px;
    }
    .action {
      appearance:none; display:flex; align-items:center; gap:12px; padding:11px 2px; border:0; color:#d8d1c5;
      background:transparent; cursor:pointer; font:400 10px/1 "Avenir Next","Helvetica Neue",sans-serif;
      letter-spacing:.28em; opacity:0; animation:fade 1s 1.8s ease forwards;
    }
    .action::before { content:""; width:28px; height:1px; background:var(--gold); transition:width .35s ease; box-shadow:0 0 10px #eac56f99; }
    .action:hover::before { width:42px; }
    .action:hover { color:#fff8e7; }
    .credit {
      position:fixed; z-index:3; right:25px; bottom:19px;
      font:italic 400 11px/1 Didot,"Times New Roman",serif; letter-spacing:.13em; color:#b7a88788;
    }

    /* 第二幕：把手写原稿作为真正的礼物保留下来 */
    .letter-view {
      position:fixed; inset:0; z-index:10; display:grid; place-items:center; padding:5vh 5vw;
      color:#29213a; visibility:hidden; opacity:0; transform:scale(1.015);
      transition:opacity .75s ease,transform .9s cubic-bezier(.2,.8,.2,1),visibility 0s .9s;
      background:
        radial-gradient(circle at 75% 22%,rgba(255,240,207,.24),transparent 27%),
        radial-gradient(circle at 16% 74%,rgba(189,220,226,.20),transparent 30%),
        linear-gradient(145deg,#a99ab1,#8f809e 58%,#9a8aa5);
    }
    .letter-view::before {
      content:""; position:absolute; inset:0; pointer-events:none; opacity:.22;
      background-image:repeating-linear-gradient(115deg,transparent 0 3px,rgba(255,255,255,.05) 3px 4px);
      mix-blend-mode:soft-light;
    }
    .letter-view.open { visibility:visible; opacity:1; transform:scale(1); transition-delay:0s; }
    .letter-shell {
      position:relative; width:min(1120px,90vw); height:min(820px,86vh); display:grid;
      grid-template-columns:.78fr 1fr; align-items:center; gap:clamp(34px,5vw,82px);
    }
    .letter-copy { padding-left:clamp(0px,2vw,30px); }
    .letter-kicker {
      margin:0 0 24px; font:500 10px/1 "Avenir Next","Helvetica Neue",sans-serif;
      color:#f2dfb8; letter-spacing:.45em;
    }
    .letter-copy h2 {
      margin:0 0 34px; font:300 clamp(42px,5vw,72px)/1.2 "Songti SC","STSong",serif;
      letter-spacing:.18em; color:#fff8e8; text-shadow:0 3px 22px rgba(46,30,55,.25);
    }
    .letter-body {
      margin:0; max-width:430px; font:300 clamp(14px,1.15vw,18px)/2.2 "Kaiti SC","STKaiti","Songti SC",serif;
      letter-spacing:.08em; color:#282037;
    }
    .letter-body strong { display:block; margin-bottom:16px; color:#fff3d5; font-weight:400; }
    .letter-sign { margin-top:30px; font:italic 400 16px/1 Didot,serif; color:#f1ddae; letter-spacing:.12em; }
    .letter-art {
      margin:0; height:100%; display:flex; align-items:center; justify-content:center; position:relative;
    }
    .letter-art img {
      display:block; max-width:100%; max-height:100%; object-fit:contain; border-radius:2px;
      box-shadow:0 28px 80px rgba(41,27,51,.32),0 0 0 1px rgba(255,246,226,.22);
    }
    .close-letter {
      appearance:none; position:absolute; z-index:2; right:2.5vw; top:2.5vh; border:0; padding:12px;
      background:transparent; color:#fff4dc; cursor:pointer; font:400 10px/1 "Avenir Next",sans-serif;
      letter-spacing:.32em;
    }
    .close-letter::after { content:" ×"; font-size:18px; vertical-align:-2px; }
    @keyframes rise { to { opacity:1; transform:translateY(0); } }
    @keyframes fade { to { opacity:1; } }

    @media (orientation:portrait), (max-aspect-ratio:4/5) {
      .art img { object-position:center; }
      .veil {
        background:
          linear-gradient(180deg,rgba(1,4,11,.40) 0%,rgba(1,4,11,.08) 33%,transparent 55%,rgba(0,0,0,.20) 100%),
          radial-gradient(circle at 50% 10%,rgba(16,27,57,.22),transparent 36%);
      }
      main { width:100%; height:auto; display:block; padding:0 24px; text-align:center; top:max(34px,5.5vh); }
      .copy { width:100%; transform:none; }
      .eyebrow { margin-bottom:14px; font-size:8px; letter-spacing:.42em; }
      .age-line { justify-content:center; gap:11px; margin-bottom:10px; }
      .age { font-size:clamp(60px,18vw,92px); }
      .age-note { font-size:7px; line-height:1.7; text-align:left; padding-bottom:1px; }
      .rule { margin:0 auto 13px; width:34px; }
      h1 { font-size:clamp(31px,9vw,48px); letter-spacing:.23em; padding-left:.23em; }
      .birthday { margin-top:7px; font-size:11px; letter-spacing:.58em; padding-left:.58em; }
      .wish { margin:15px auto 0; padding:0; border:0; max-width:320px; font-size:10px; line-height:1.8; letter-spacing:.1em; }
      .signature { display:none; }
      .actions { left:50%; transform:translateX(-50%); bottom:max(14px,calc(env(safe-area-inset-bottom) + 7px)); gap:13px; white-space:nowrap; }
      .action { font-size:7px; gap:8px; }
      .action::before { width:12px; }
      .credit { display:none; }
      .letter-view { padding:54px 16px 30px; }
      .letter-shell { display:block; width:100%; height:100%; }
      .letter-copy { display:none; }
      .letter-art { width:100%; height:100%; }
      .letter-art img { max-height:100%; border-radius:6px; box-shadow:0 18px 55px rgba(41,27,51,.34); }
      .close-letter { right:12px; top:10px; }
    }
    @media (prefers-reduced-motion:reduce) {
      *,*::before,*::after { animation-duration:.01ms!important; animation-delay:0ms!important; transition-duration:.01ms!important; transition-delay:0ms!important; }
    }
  </style>
</head>
<body>
  <picture class="art">
    <source media="(orientation: portrait)" srcset="cake-portrait-v2.jpg">
    <img src="cake-landscape-v2.jpg" alt="深蓝星河生日蛋糕">
  </picture>
  <div class="veil"></div>

  <main>
    <section class="copy" aria-label="生日祝福">
      <p class="eyebrow">A LITTLE UNIVERSE · JUST FOR YOU</p>
      <div class="age-line">
        <div class="age">23</div>
        <div class="age-note">YEARS<br>OF LIGHT</div>
      </div>
      <div class="rule"></div>
      <h1>零一秒</h1>
      <p class="birthday">生日快乐</p>
      <p class="wish">生于盛夏，绽放灿烂明媚<br><span>愿你像八月一样热烈，也像夏风一样自由</span></p>
      <p class="signature">May your summer never end.</p>
    </section>
  </main>

  <div class="actions">
    <button class="action" id="openLetter" type="button">打开手写祝福</button>
  </div>
  <div class="credit">August 17 · for 01s</div>

  <section class="letter-view" id="letterView" aria-hidden="true" aria-label="手写生日祝福">
    <button class="close-letter" id="closeLetter" type="button">回到星河</button>
    <div class="letter-shell">
      <div class="letter-copy">
        <p class="letter-kicker">AN AUGUST LETTER · 2026</p>
        <h2>盛夏予你</h2>
        <p class="letter-body">
          <strong>祝福你像八月一样热烈，也像夏风一样自由。</strong>
          愿盛夏赋予你的热烈，不会随着季节散场。<br>
          愿往后的每一年，都依然有爱、有光、有期待。<br>
          把属于自己的日子，过得热烈而丰盛。
        </p>
        <p class="letter-sign">For 01s, with all the light.</p>
      </div>
      <figure class="letter-art"><img src="handwritten-wish-v2.jpg" alt="写给零一秒的手绘生日祝福"></figure>
    </div>
  </section>

  <script>
    const openLetter=document.querySelector("#openLetter");
    const closeLetter=document.querySelector("#closeLetter");
    const letterView=document.querySelector("#letterView");
    function showLetter(){letterView.classList.add("open");letterView.setAttribute("aria-hidden","false");}
    function hideLetter(){letterView.classList.remove("open");letterView.setAttribute("aria-hidden","true");}
    openLetter.addEventListener("click",showLetter);
    closeLetter.addEventListener("click",hideLetter);
    addEventListener("keydown",e=>{if(e.key==="Escape")hideLetter();});
    if(new URLSearchParams(location.search).has("letter"))showLetter();
  </script>
</body>
</html>
